<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevAtlas — справочник разработчика</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c9cff'/%3E%3Cstop offset='1' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 11l-4 5 4 5M22 11l4 5-4 5M18 9l-4 14' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#070913;--text:#e8ecff;--dim:#98a2c8;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.045);--a:#7c9cff;--b:#c084fc;--c:#7c9cff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.55;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
code,kbd,.mono{font-family:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,monospace}
::selection{background:rgba(124,156,255,.4)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px}

.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(1200px 700px at 50% -10%,#151b48 0%,transparent 60%),var(--bg)}
.aurora::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(95px);will-change:transform}
.b1{width:540px;height:540px;left:-140px;top:-100px;background:#4a5cff;opacity:.5;animation:d1 22s ease-in-out infinite alternate}
.b2{width:480px;height:480px;right:-120px;top:14%;background:#b04cff;opacity:.42;animation:d2 27s ease-in-out infinite alternate}
.b3{width:560px;height:560px;left:28%;bottom:-260px;background:#19c3b0;opacity:.3;animation:d3 31s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(220px,140px) scale(1.18)}}
@keyframes d2{to{transform:translate(-200px,160px) scale(1.12)}}
@keyframes d3{to{transform:translate(-240px,-90px) scale(1.2)}}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
.glow{position:fixed;width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(124,156,255,.13),transparent 62%);transform:translate(-50%,-50%);left:50%;top:40%}

.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);background:linear-gradient(rgba(7,9,19,.78),rgba(7,9,19,.4));border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:.2px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:0 6px 26px rgba(124,156,255,.5)}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:4px}
nav a{padding:8px 15px;border-radius:11px;color:var(--dim);font-size:14px;font-weight:500;transition:.2s}
nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav a.on{color:#fff;background:rgba(255,255,255,.1)}

.shell{position:relative;z-index:2;max-width:1200px;margin:auto;padding:26px 24px 90px}
.view{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.99);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.btn{position:relative;display:inline-flex;align-items:center;gap:11px;padding:17px 30px;border-radius:17px;font-weight:600;font-size:16px;border:1px solid var(--line);color:#fff;cursor:pointer;background:var(--glass);backdrop-filter:blur(12px);transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%);transition:transform .75s}
.btn:hover::after{transform:translateX(130%)}
.btn:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);box-shadow:0 16px 44px rgba(0,0,0,.45)}
.btn:active{transform:scale(.97)}
.btn.pri{border:none;background:linear-gradient(120deg,var(--a),var(--b));box-shadow:0 12px 38px rgba(124,156,255,.42)}
.btn.pri:hover{box-shadow:0 18px 52px rgba(170,120,255,.6)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{padding:10px 18px;font-size:14px;border-radius:13px}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;min-height:calc(100vh - 160px)}
.chip{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;color:var(--dim)}
.chip i{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
h1.big{font-size:clamp(46px,7.4vw,100px);line-height:1;letter-spacing:-2.5px;font-weight:800;margin:24px 0 22px;background:linear-gradient(100deg,#fff 0%,#a9b8ff 30%,#d6a8ff 55%,#7ef0dc 80%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.lead{font-size:19px;color:var(--dim);max-width:540px}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin:36px 0 38px}
.stats{display:flex;gap:40px;flex-wrap:wrap}
.stat b{font-size:32px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--dim)}

.stage{perspective:1300px;position:relative}
.show{position:relative;border-radius:28px;padding:22px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 44px 110px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);transform-style:preserve-3d;transition:transform .18s ease-out}
.dots{display:flex;gap:7px;margin-bottom:14px;align-items:center}
.dots i{width:11px;height:11px;border-radius:50%}
.dots span{margin-left:10px;font-size:12px;color:var(--dim)}
.codeblk{margin-top:14px;padding:14px 16px;border-radius:14px;background:#050712;border:1px solid rgba(255,255,255,.07);font-size:12.5px;line-height:1.8}
.float{position:absolute;padding:10px 15px;border-radius:13px;font-size:13px;font-weight:600;background:rgba(12,16,40,.88);border:1px solid rgba(255,255,255,.15);box-shadow:0 16px 38px rgba(0,0,0,.5);animation:fl 6s ease-in-out infinite;transform:translateZ(70px)}
.float.f1{left:-26px;top:70px}
.float.f2{right:-22px;top:190px;animation-delay:-2s}
.float.f3{left:34px;bottom:-24px;animation-delay:-4s}
@keyframes fl{50%{translate:0 -12px}}

.page-h{margin:34px 0 30px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:14px;margin-bottom:20px;cursor:pointer;transition:.2s;padding:6px 12px 6px 8px;border-radius:10px;border:0;background:none}
.back:hover{color:#fff;background:rgba(255,255,255,.07)}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page-h h2{font-size:clamp(34px,4.6vw,56px);letter-spacing:-1.2px;line-height:1.08}
.page-h p{color:var(--dim);max-width:660px;margin-top:12px;font-size:17px}
.grad{background:linear-gradient(100deg,var(--c),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.panel{border-radius:24px;padding:28px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.panel h3{font-size:19px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.panel h3 i{width:9px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
.panel p{color:var(--dim)}
.panel ul{list-style:none;padding:0;display:grid;gap:10px}
.panel li{display:flex;gap:12px;color:#cfd6f5;font-size:15px}
.panel li::before{content:"";flex:none;width:7px;height:7px;margin-top:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.panel li.dl::before{display:none}
.panel li.dl{align-items:flex-start}
.panel li.dl i{flex:none;width:10px;height:10px;margin-top:7px;border-radius:3px}
.panel li.dl span{color:var(--dim);display:block;font-size:13.5px}
.steps{counter-reset:s}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;margin:0;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;box-shadow:none}
kbd{padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;font-size:12.5px;color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:6px 13px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dfe5ff}

.card{position:relative;padding:30px;border-radius:26px;background:var(--glass);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:block;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(440px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 28%,transparent),transparent 62%);opacity:0;transition:opacity .35s}
.card:hover{transform:translateY(-9px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 30px 70px color-mix(in srgb,var(--c) 22%,transparent)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.ico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 17%,transparent);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);color:var(--c);margin-bottom:22px;box-shadow:0 0 34px color-mix(in srgb,var(--c) 26%,transparent)}
.ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:23px;margin-bottom:9px;letter-spacing:-.3px}
.card p{color:var(--dim);font-size:15px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:13px;color:var(--dim)}
.meta b{padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:600}
.arrow{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:.3s}
.arrow svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card:hover .arrow{background:var(--c);border-color:transparent;transform:translateX(4px)}
.card .num{position:absolute;right:22px;top:20px;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:7px;padding:2px 8px}

.sbox{position:relative;margin:0 0 26px}
.sbox input{width:100%;padding:18px 20px 18px 54px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05);backdrop-filter:blur(14px);color:#fff;font-size:16px;font-family:inherit;outline:none;transition:.25s}
.sbox input:focus{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.sbox svg{position:absolute;left:19px;top:50%;translate:0 -50%;width:21px;height:21px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}
.sbox kbd{position:absolute;right:16px;top:50%;translate:0 -50%}
.res{display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.2s;margin-bottom:8px}
.res:hover{background:rgba(255,255,255,.09);transform:translateX(5px);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.res i{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.res code{font-size:13.5px;color:#fff;min-width:140px}
.res span{color:var(--dim);font-size:14px;flex:1}
.res em{font-style:normal;font-size:12px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);padding:2px 9px;border-radius:999px}
.sec-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.pill{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--dim);font-size:13.5px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.pill:hover{color:#fff;background:rgba(255,255,255,.09)}
.pill.on{color:#fff;background:color-mix(in srgb,var(--c) 26%,transparent);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}

.grp{margin-bottom:36px}
.gh{display:flex;align-items:center;gap:12px;font-size:20px;margin-bottom:16px;letter-spacing:-.2px}
.gh i{width:10px;height:26px;border-radius:4px;background:var(--gc,var(--c));box-shadow:0 0 18px var(--gc,var(--c))}
.gh small{font-size:13px;color:var(--dim);font-weight:400}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.03);backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
th{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:left;padding:15px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035);font-weight:600}
td{padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(255,255,255,.045)}
td:first-child{font-weight:600;color:#fff}
.bd{display:inline-block;padding:3px 11px;border-radius:9px;font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;border:1px solid color-mix(in srgb,var(--t) 40%,transparent);color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent);white-space:nowrap}
.yes{color:#34d399}.no{color:#f87171}.nil{color:var(--dim)}

.cmd{padding:16px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.28s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.cmd:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-3px);background:rgba(255,255,255,.055)}
.cc{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:13px 14px;border-radius:12px;background:#050712;border:1px solid rgba(255,255,255,.07)}
.cc code{font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:#dfe5ff;line-height:1.65}
.cmd p{margin-top:11px;color:var(--dim);font-size:14.5px}
.cp{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.2s}
.cp:hover{color:#fff;background:var(--c);border-color:transparent;transform:scale(1.08)}
.cp svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
code i{font-style:normal}
.k{color:#c792ea}.s{color:#c3e88d}.f{color:#ffcb6b}.c{color:#82aaff;font-weight:600}.sub{color:#f78c6c}

.hc{display:flex;gap:16px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:.28s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.hc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--h) 60%,transparent);background:color-mix(in srgb,var(--h) 7%,transparent)}
.hc b{font-size:26px;color:var(--h);text-shadow:0 0 22px color-mix(in srgb,var(--h) 60%,transparent);min-width:64px;line-height:1.2}
.hc h4{font-size:16px;margin-bottom:3px}
.hc p{color:var(--dim);font-size:14px}

.chart{border-radius:24px;padding:20px 22px 12px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);margin-bottom:36px}
.chart svg{width:100%;height:auto;display:block}
.curve{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;padding:6px 6px 12px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px;color:#cfd6f5}
.legend i{width:22px;height:4px;border-radius:3px}

.tester{margin-bottom:36px}
.row{display:grid;grid-template-columns:1fr 120px;gap:14px;margin-bottom:14px}
.tester input,.tester textarea{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#050712;color:#fff;font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;outline:none;transition:.2s;resize:vertical}
.tester input:focus,.tester textarea:focus{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 16%,transparent)}
.tester label{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.out{margin-top:16px;padding:16px;border-radius:14px;background:#050712;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;min-height:56px}
.out mark{background:color-mix(in srgb,var(--c) 38%,transparent);color:#fff;border-radius:5px;padding:1px 3px;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent)}
.rxi{margin-top:12px;font-size:13.5px;color:var(--dim)}
.rxi b{color:#fff}
.err{color:#f87171}
.venns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:36px}
.vn{padding:18px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line);text-align:center;transition:.3s}
.vn:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.vn svg{width:120px;height:auto;margin-bottom:10px}
.vn h4{font-size:15px;margin-bottom:5px;font-family:"JetBrains Mono",Consolas,monospace}
.vn p{font-size:13px;color:var(--dim)}
.empty{text-align:center;padding:50px;color:var(--dim);border:1px dashed var(--line);border-radius:20px}
.toast{position:fixed;left:50%;bottom:34px;translate:-50% 30px;opacity:0;padding:12px 22px;border-radius:14px;background:rgba(20,26,60,.95);border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 44px rgba(0,0,0,.5);z-index:60;transition:.35s;pointer-events:none;font-size:14px}
.toast.on{translate:-50% 0;opacity:1}
footer{position:relative;z-index:2;text-align:center;color:var(--dim);font-size:13px;padding:0 24px 40px}

@media(max-width:900px){.hero{grid-template-columns:1fr;gap:40px;min-height:0;padding-top:20px}.float{display:none}nav a{padding:8px 10px}.brand span{display:none}.row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<canvas id="fx"></canvas>

const hlSql=s=>esc(s).replace(/('[^']*')/g,'<i class="s">$1</i>').replace(SQLK,'<i class="k">$1</i>');
const hlSh=s=>{let t=esc(s);t=t.replace(/("[^"]*"|'[^']*')/g,'<i class="s">$1</i>');t=t.replace(/(^|\s)(--?[a-zA-Z][\w-]*)/g,'$1<i class="f">$2</i>');return t.replace(/^(git)( [a-z][\w-]*)?|^([\w./-]+)/,(m,a,b,c)=>c?`<i class="c">${c}</i>`:`<i class="c">${a}</i>${b?`<i class="sub">${b}</i>`:''}`)};

const TC=['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];
const tier=s=>s==='—'?-1:s.includes('2ⁿ')?4:s.includes('²')?3:s.includes('n log n')?2:(s==='O(1)'||s==='O(log n)')?0:1;
const bd=s=>{const t=tier(s);return t<0?'<span class="nil">—</span>':`<span class="bd" style="--t:${TC[t]}">${esc(s)}</span>`};

const grp=(title,html,col,small)=>`<section class="grp"${col?` style="--gc:${col}"`:''}><h3 class="gh"><i></i>${esc(title)}${small?` <small>${small}</small>`:''}</h3>${html}</section>`;
const cmdItem=(c,d,h,k)=>`<div class="item cmd" style="animation-delay:${(k%8)*40}ms" data-t="${at((c+' '+d).toLowerCase())}"><div class="cc"><code>${h(c)}</code><button class="cp" data-copy="${encodeURIComponent(c)}" title="Копировать">${svg('copy')}</button></div><p>${esc(d)}</p></div>`;
const cmdGroups=(G,h)=>{let k=0;return G.map(g=>grp(g.t,`<div class="grid g2">${g.i.map(x=>cmdItem(x[0],x[1],h,k++)).join('')}</div>`,null,g.i.length+' шт.')).join('')};
const table=(head,rows)=>`<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;

function sci(l){const e=Math.floor(l),m=Math.pow(10,l-e);return `≈ ${m.toFixed(1).replace('.',',')}·10<sup>${e}</sup>`}
function fmtOps(v){return v<1e7?Math.round(v).toLocaleString('ru-RU'):sci(Math.log10(v))}

function chartSvg(mini){
  const W=640,H=mini?290:380,P=mini?{l:30,r:12,t:12,b:26}:{l:50,r:20,t:18,b:42};
  const xm=12,ym=100;
  const X=x=>P.l+(x-1)/(xm-1)*(W-P.l-P.r),Y=y=>H-P.b-y/ym*(H-P.t-P.b);
  const F=[['O(1)',n=>1,'#34d399'],['O(log n)',n=>Math.log2(n),'#22d3ee'],['O(n)',n=>n,'#818cf8'],['O(n log n)',n=>n*Math.log2(n),'#e879f9'],['O(n²)',n=>n*n,'#fb923c'],['O(2ⁿ)',n=>Math.pow(2,n),'#f87171']];
  let g='';
  for(let y=0;y<=ym;y+=25){g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="rgba(255,255,255,.08)"/><text x="${P.l-8}" y="${Y(y)+4}" fill="#98a2c8" font-size="11" text-anchor="end">${y}</text>`}
  [1,4,8,12].forEach(x=>{g+=`<line y1="${P.t}" y2="${H-P.b}" x1="${X(x)}" x2="${X(x)}" stroke="rgba(255,255,255,.05)"/><text x="${X(x)}" y="${H-P.b+18}" fill="#98a2c8" font-size="11" text-anchor="middle">${x}</text>`});
  g+=`<text x="${W-P.r}" y="${H-6}" fill="#98a2c8" font-size="11" text-anchor="end">n — размер входных данных</text>`;
  if(!mini)g+=`<text x="14" y="${P.t+6}" fill="#98a2c8" font-size="11">операции</text>`;
  const cid='cp'+(mini?'m':'f');
  let paths='';
  F.forEach((f,i)=>{let d='';for(let x=1;x<=xm+1e-9;x+=.05){d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(f[1](x)).toFixed(1)}
    paths+=`<path class="curve" pathLength="1" d="${d}" stroke="${f[2]}" style="animation-delay:${i*.18}s;filter:drop-shadow(0 0 6px ${f[2]})"/>`});
  const leg=mini?'':`<div class="legend">${F.map(f=>`<span><i style="background:${f[2]}"></i><code>${f[0]}</code></span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${W} ${H}"><defs><clipPath id="${cid}"><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}"/></clipPath></defs>${g}<g clip-path="url(#${cid})">${paths}</g></svg>${leg}`;
}

function venn(t,c){
  const id='v'+t,A='<circle cx="30" cy="24" r="17"',B='<circle cx="50" cy="24" r="17"';
  const fill=t==='inner'?`${B} fill="${c}" clip-path="url(#${id})"/>`:t==='left'?`${A} fill="${c}"/>`:t==='right'?`${B} fill="${c}"/>`:`${A} fill="${c}"/>${B} fill="${c}"/>`;
  return `<svg viewBox="0 0 80 48"><defs><clipPath id="${id}">${A}/></clipPath></defs><g fill-opacity=".82">${fill}</g>${A} fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>${B} fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/></svg>`;
}

function applyFilter(){
  const q=($('#q')?.value||'').trim().toLowerCase();
  const k=$('.pill.on[data-k]')?.dataset.k;
  let n=0;
  $$('.item').forEach(el=>{const ok=(!q||el.dataset.t.includes(q))&&(!k||k==='all'||el.dataset.k===k);el.hidden=!ok;if(ok)n++});
  $$('.grp').forEach(g=>{if(g.querySelector('.item'))g.hidden=![...g.querySelectorAll('.item')].some(i=>!i.hidden)});
  const e=$('#empty');if(e)e.hidden=n>0;
}

function runRx(){
  const p=$('#rx').value,f=$('#fl').value.replace(/[^dgimsuvy]/g,''),t=$('#tx').value,o=$('#out'),m=$('#rxi');
  if(!p){o.textContent=t;m.innerHTML='Введите шаблон.';return}
  try{
    const r=new RegExp(p,f.includes('g')?f:f+'g');
    let h='',last=0,c=0,groups=[];
    for(const x of t.matchAll(r)){
      if(++c>500)break;
      h+=esc(t.slice(last,x.index))+'<mark>'+esc(x[0])+'</mark>';
      last=x.index+x[0].length;
      if(x.length>1&&groups.length<6)groups.push(x.slice(1).map(v=>v===undefined?'∅':esc(v)).join(' · '));
    }
    o.innerHTML=h+esc(t.slice(last));
    m.innerHTML=`Совпадений: <b>${Math.min(c,500)}</b>`+(groups.length?`<br>Группы: ${groups.map((g,i)=>`<b>${i+1}</b>) ${g}`).join(' &nbsp; ')}`:'');
  }catch(e){o.textContent=t;m.innerHTML=`<span class="err">Ошибка шаблона: ${esc(e.message)}</span>`}
}

function countUp(){
  $$('[data-n]').forEach(el=>{const to=+el.dataset.n,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

function render(){
  const h=(location.hash||'#/').slice(1);
  route=h.split('/').filter(Boolean);
  let html,hook;
  if(route[0]==='about')html=about();
  else if(route[0]==='menu'){html=menu();hook=()=>{$('#gq').addEventListener('input',onGlobal)}}
  else if(route[0]==='s'&&SEC[route[1]]){html=section(route[1]);hook=()=>{
    $('#q').addEventListener('input',applyFilter);
    $$('.pill[data-k]').forEach(b=>b.addEventListener('click',()=>{$$('.pill[data-k]').forEach(x=>x.classList.remove('on'));b.classList.add('on');applyFilter()}));
    if(route[1]==='regex'){['#rx','#fl','#tx'].forEach(s=>$(s).addEventListener('input',runRx));runRx()}
    applyFilter();
  }}
  else{html=home();hook=countUp;route=[]}
  app.innerHTML=`<div class="view">${html}</div>`;
  hook&&hook();
  window.scrollTo(0,0);
  const cur=route[0]==='about'?'about':route[0]==='menu'||route[0]==='s'?'menu':'home';
  $$('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===cur));
}

function onGlobal(e){
  const q=e.target.value.trim().toLowerCase(),box=$('#gres'),cards=$('#cards');

}

});

  if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}
  const s=$('#show');
  if(s){const r=s.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/innerWidth,dy=(e.clientY-(r.top+r.height/2))/innerHeight;s.style.transform=`rotateY(${dx*14}deg) rotateX(${-dy*14}deg)`}
});

document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName,typing=tag==='INPUT'||tag==='TEXTAREA';
  if(e.key==='Escape'){
    if(typing)document.activeElement.blur();
    if(route[0]==='s')location.hash='#/menu';
    else if(route[0]==='menu'||route[0]==='about')location.hash='#/';
    return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){const i=$('#q')||$('#gq');if(i){e.preventDefault();i.focus()}return}
  if(route[0]==='menu'&&/^[1-6]$/.test(e.key))location.hash='#/s/'+SECTIONS[+e.key-1].id;
});

(function(){
  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  let w,h,P=[];
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){
    w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);
    P=Array.from({length:Math.round(w*h/20000)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.3+.4}));
  }
  function tick(){
    x.clearRect(0,0,w,h);
    for(const p of P){
      if(!calm){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0}
      x.fillStyle='rgba(190,205,255,.55)';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
    }
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;
      if(d<12100){x.strokeStyle=`rgba(150,170,255,${.16*(1-d/12100)})`;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}
    }
    if(!calm)requestAnimationFrame(tick);
  }
  size();tick();
  addEventListener('resize',()=>{size();if(calm)tick()});
})();

addEventListener('hashchange',render);
render();
</script>
</body>
</html>
